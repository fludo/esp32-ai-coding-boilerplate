; ESP32 AI coding boilerplate - PlatformIO configuration
;
; One environment per supported board. Shared settings live in [env] and are
; inherited by every board environment; [env:native] runs host-side unit tests.
; Board notes and how to add a board: .claude/skills/esp32-platform/references/boards.md
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

; ---------------------------------------------------------------------------
; Shared firmware settings (Arduino core 3.x on the official platform)
; ---------------------------------------------------------------------------
[env]
platform = espressif32 @ ~8.0.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_type = debug
; Warnings for project sources only (framework code is not affected)
build_src_flags =
    -Wall
    -Wextra
; Log level 0..5 (none..verbose); the framework presets 0, so unflag it first
build_unflags =
    -DCORE_DEBUG_LEVEL=0
build_flags =
    -D CORE_DEBUG_LEVEL=3
; On-target tests live in test/embedded/, host tests in test/native/
test_filter = embedded/*
; Static analysis: `pio check` (framework packages are skipped)
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<lib/>
    +<include/>
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction
check_severity = medium, high

; ---------------------------------------------------------------------------
; Boards
; ---------------------------------------------------------------------------

; Generic ESP32-WROOM-32 DevKit (also fits most "ESP32 Dev Module" clones).
; The Arduino variant defines no LED; most clones have one on GPIO2.
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D APP_LED_PIN=2

; ESP32-S3-DevKitC-1 (N8). Addressable RGB LED (RGB_BUILTIN).
; Two USB ports: "UART" (CP210x bridge) and "USB" (native). Serial goes to UART
; by default; add -D ARDUINO_USB_CDC_ON_BOOT=1 to use the native port instead.
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

; ESP32-S2-Saola-1. Addressable RGB LED (RGB_BUILTIN). Single core.
[env:esp32-s2-saola-1]
board = esp32-s2-saola-1

; ESP32-C3-DevKitM-1. Addressable RGB LED (RGB_BUILTIN). Single core, RISC-V.
[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

; WEMOS/LOLIN C3 Mini. Native USB only (USB-CDC on boot is preset by the board).
[env:lolin_c3_mini]
board = lolin_c3_mini

; ESP32-C6-DevKitC-1. Addressable RGB LED (RGB_BUILTIN). Wi-Fi 6, BLE, 802.15.4.
[env:esp32-c6-devkitc-1]
board = esp32-c6-devkitc-1

; ---------------------------------------------------------------------------
; Host-side unit tests for framework-free code in lib/  (pio test -e native)
; ---------------------------------------------------------------------------
[env:native]
platform = native
framework =
build_src_flags =
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
test_filter = native/*
test_build_src = no
