name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Quality gate (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32-s3-devkitc-1, esp32-s2-saola-1, esp32-c3-devkitm-1, lolin_c3_mini, esp32-c6-devkitc-1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO and clang-format
        run: pip install platformio clang-format
      # Same gate as local development: format, static analysis, host tests,
      # firmware build, on-target test compilation.
      - name: scripts/check.sh
        run: scripts/check.sh -e ${{ matrix.env }}
